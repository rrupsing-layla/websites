function Card({ title, sub, children, footnote }) {
  return (
    <div style={{ background: C.card, borderRadius: 14, padding: "20px 22px", boxShadow: "0 1px 3px rgba(31,43,51,0.08)", marginBottom: 22 }}>

function Toggle({ options, value, onChange }) {
  return (
    <div style={{ display: "inline-flex", background: "#EEF3F4", borderRadius: 8, padding: 3, gap: 2, marginBottom: 10, flexWrap: "wrap" }}>
      {options.map((o) => (
        <button key={o} onClick={() => onChange(o)} style={{
          border: "none", cursor: "pointer", padding: "5px 12px", borderRadius: 6, fontSize: 12.5, fontWeight: 600,
          background: value === o ? C.teal : "transparent", color: value === o ? "#fff" : C.sub, ...font,
        }}>{o}</button>
      ))}
    </div>
  );
}

// Multi-select year dropdown
function YearSelect({ selected, onChange, label = "Cohort years", years = YEARS }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, []);
  const toggleYear = (y) => {
    const next = selected.includes(y) ? selected.filter((v) => v !== y) : [...selected, y];
    if (next.length > 0) onChange(years.filter((v) => next.includes(v)));
  };
  const summary = selected.length === years.length ? "All years" : selected.map((y) => y.replace("CY", "")).join(", ");
  return (
    <div ref={ref} style={{ position: "relative", display: "inline-block", marginLeft: 10, marginBottom: 10, verticalAlign: "top" }}>
      <button onClick={() => setOpen(!open)} style={{
        ...font, cursor: "pointer", fontSize: 12.5, fontWeight: 600, color: C.ink,
        background: "#fff", border: `1px solid ${C.grid}`, borderRadius: 8, padding: "6px 12px",
        display: "flex", alignItems: "center", gap: 6,
      }}>
        <span style={{ color: C.sub, fontWeight: 500 }}>{label}:</span> {summary}
        <span style={{ fontSize: 10, color: C.sub }}>{open ? "▲" : "▼"}</span>
      </button>
      {open && (
        <div style={{
          position: "absolute", top: "calc(100% + 4px)", left: 0, zIndex: 20, background: "#fff",
          border: `1px solid ${C.grid}`, borderRadius: 10, boxShadow: "0 6px 18px rgba(31,43,51,0.14)",
          padding: 8, minWidth: 160,
        }}>
          {years.map((y) => (
            <label key={y} style={{ ...font, display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: C.ink, padding: "5px 8px", borderRadius: 6, cursor: "pointer" }}
              onMouseEnter={(e) => (e.currentTarget.style.background = "#F1F6F6")}
              onMouseLeave={(e) => (e.currentTarget.style.background = "transparent")}
            >
              <input type="checkbox" checked={selected.includes(y)} onChange={() => toggleYear(y)}
                style={{ accentColor: C.teal, width: 15, height: 15, cursor: "pointer" }} />
              {y} {y === "CY2026" && <span style={{ fontSize: 10.5, color: C.sub }}>(to May 31)</span>}
            </label>
          ))}
          <div style={{ display: "flex", gap: 6, marginTop: 4, borderTop: `1px solid ${C.grid}`, paddingTop: 6 }}>
            <button onClick={() => onChange([...years])} style={{ ...font, flex: 1, fontSize: 11.5, fontWeight: 600, color: C.teal, background: "#EEF3F4", border: "none", borderRadius: 6, padding: "4px 6px", cursor: "pointer" }}>All</button>
          </div>
        </div>
      )}
    </div>
  );
}

    const acc = {};
    ORDER.forEach((b) => (acc[b] = { at: 0, na: 0, ns: 0 }));
    R1.forEach(([c, a, at, na, ns]) => {
      if (!funnelYears.includes(c)) return;
      const b = acc[band(a)];
      b.at += at; b.na += na; b.ns += ns;
    });
    return ORDER.map((b) => {
      const { at, na, ns } = acc[b];
      const t = at + na + ns;
      return { band: b, intakes: t, attended: pct(at, t), noShowFirst: pct(na, t), notScheduled: pct(ns, t) };
    });
  }, [funnelYears]);

  const funnelAge = useMemo(() => {
    const acc = {};
    R1.forEach(([c, a, at, na, ns]) => {
      if (!funnelYears.includes(c) || a < 16 || a > 60) return;
      if (!acc[a]) acc[a] = { at: 0, t: 0 };
      acc[a].at += at; acc[a].t += at + na + ns;
    });
    return Object.keys(acc).map(Number).sort((x, y) => x - y)
      .filter((a) => acc[a].t >= 30)

              <Bar yAxisId="r" dataKey="clients" name="Clients" fill={C.lightBar} radius={[4, 4, 0, 0]} />
              <Line yAxisId="l" dataKey="dropRate" name="Early drop-off rate" stroke={C.coral} strokeWidth={3} dot={{ r: 4 }} connectNulls
                label={{ position: "top", fontSize: 10.5, fill: C.coral, fontWeight: 600, formatter: (v) => (v === null || v === undefined ? "" : `${Math.round(v)}%`) }} />
            </ComposedChart>
          </ResponsiveContainer>
        </Card>

        {/* 4. Sessions */}
        <Card
          title="4 · Average lifetime sessions — also flat through the middle"
          sub="Among clients who completed a first session (2021–May 2026 pooled), average sessions hover around 9 for every band from 18 to 59. Only the edges differ: under-18s (7.9) and 60+ (7.6) do meaningfully fewer sessions. Notably, 18–21s who do start average the most sessions of any band (9.9) — young clients who get through the door engage deeply."
          footnote={`Source: A.5.1 sessions report. Currently showing ${sessTotal.toLocaleString()} clients across ${sessYears.length} cohort year(s); overall average ${sessOverall} sessions. Newer cohorts have had less time to accumulate sessions, so compare ages within a similar year selection rather than across selections.`}
        >
          <YearSelect selected={sessYears} onChange={setSessYears} years={YEARS_A51} label="First-session cohorts" />
          <ResponsiveContainer width="100%" height={280}>
            <BarChart data={sessionsData} margin={{ top: 18, right: 10, left: 0, bottom: 0 }}>
              <CartesianGrid stroke={C.grid} vertical={false} />
              <XAxis dataKey="band" tick={{ fontSize: 11.5, fill: C.sub }} />
              <YAxis domain={[0, 'auto']} tick={{ fontSize: 11.5, fill: C.sub }} />
              <Tooltip contentStyle={tipStyle} formatter={(v, n) => [n === "Avg sessions" ? v : v.toLocaleString(), n]} />
              <Bar dataKey="avgSessions" name="Avg sessions" radius={[5, 5, 0, 0]} label={{ position: "top", fontSize: 11, fill: C.ink }}>
                {sessionsData.map((e) => (
                  <Cell key={e.band} fill={e.avgSessions !== null && e.avgSessions < sessOverall * 0.9 ? C.coral : C.teal} />
                ))}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </Card>


        {/* 5. Match rate by age */}
        <Card
          title="5 · Match rate — of clients who completed an intake call, how many got a first session booked"
          sub="Denominator excludes form-only clients, intake no-shows, intake cancellations, and calls booked but not yet completed — so this isolates the matching step itself. The age gradient narrows a lot once someone actually does an intake call: 18–24s match at 64–66% vs ~73–76% for 35+, a far smaller gap than in overall funnel conversion. Minors are the real outlier at 51% — a genuine placement challenge rather than an engagement one."
          footnote={`Source: B1 client status report. Currently showing ${matchTotal.toLocaleString()} completed intake calls across ${matchYears.length} cohort year(s); overall match rate ${matchOverall}%. First session booked counts as matched regardless of attendance.`}
        >
          <YearSelect selected={matchYears} onChange={setMatchYears} />
          <ResponsiveContainer width="100%" height={300}>
            <ComposedChart data={matchBand} margin={{ top: 5, right: 10, left: 0, bottom: 0 }}>
              <CartesianGrid stroke={C.grid} vertical={false} />
              <XAxis dataKey="band" tick={{ fontSize: 11.5, fill: C.sub }} />
              <YAxis yAxisId="l" unit="%" domain={[0, 100]} tick={{ fontSize: 11.5, fill: C.sub }} />
              <YAxis yAxisId="r" orientation="right" tick={{ fontSize: 11, fill: C.sub }} tickFormatter={(v) => v >= 1000 ? `${(v / 1000).toFixed(0)}k` : v} />
              <Tooltip contentStyle={tipStyle} formatter={(v, n) => n === "Completed intake calls" ? [v.toLocaleString(), n] : [`${v}%`, n]} />
              <Legend wrapperStyle={{ fontSize: 12 }} />
              <ReferenceLine yAxisId="l" y={matchOverall} stroke={C.sub} strokeDasharray="4 4" label={{ value: `overall ${matchOverall}%`, fontSize: 10.5, fill: C.sub, position: "insideBottomRight" }} />
              <Bar yAxisId="r" dataKey="intakeCalls" name="Completed intake calls" fill={C.lightBar} radius={[4, 4, 0, 0]} />
              <Line yAxisId="l" dataKey="matchRate" name="Match rate" stroke={C.teal} strokeWidth={3} dot={{ r: 4 }}
                label={{ position: "top", fontSize: 10.5, fill: C.teal, fontWeight: 600, formatter: (v) => (v === null || v === undefined ? "" : `${Math.round(v)}%`) }} />
            </ComposedChart>
          </ResponsiveContainer>
        </Card>

        {/* 6. Match rate trend */}
        <Card
          title="6 · Match rate trend over time — selected age group vs everyone"
          sub="Pick which age bands define the group; the teal line tracks their match rate by cohort year, and the dashed grey line is the whole population. Matching improved sharply for everyone (63% in CY2022 → ~74% in CY2025), so the interesting question is whether your group's line converges toward, tracks, or lags the overall trend. Try <18 alone: it improved too, but the gap to the population has persisted every year."
          footnote="Source: B1 client status report, completed intake calls only. CY2026 is partial (to May 31) and includes more not-yet-resolved records, so treat the last point with caution. Hover for group sizes."
        >
          <YearSelect selected={trendBands} onChange={setTrendBands} years={ORDER} label="Age group" />
          <ResponsiveContainer width="100%" height={310}>
            <ComposedChart data={matchTrend} margin={{ top: 5, right: 10, left: 0, bottom: 0 }}>
              <CartesianGrid stroke={C.grid} vertical={false} />
              <XAxis dataKey="year" tick={{ fontSize: 11.5, fill: C.sub }} />
              <YAxis unit="%" domain={[40, 90]} tick={{ fontSize: 11.5, fill: C.sub }} />
              <Tooltip contentStyle={tipStyle} formatter={(v, n, item) => {
                const d = item && item.payload ? item.payload : {};
                if (n === "Selected group") return [`${v}% (n=${(d.groupN || 0).toLocaleString()})`, n];
                if (n === "All ages") return [`${v}% (n=${(d.overallN || 0).toLocaleString()})`, n];
                return [`${v}%`, n];
              }} />
              <Legend wrapperStyle={{ fontSize: 12 }} />
              <Line dataKey="overall" name="All ages" stroke={C.slate} strokeWidth={2} strokeDasharray="6 4" dot={{ r: 3 }} />
              <Line dataKey="group" name="Selected group" stroke={C.teal} strokeWidth={3} dot={{ r: 4 }} connectNulls />
            </ComposedChart>
          </ResponsiveContainer>
        </Card>


        {/* 7. First-session attendance trend */}
        <Card
          title="7 · 1st session attendance — of clients with a 1st session booked, how many attended"
          sub="The last step of the funnel: a therapist was matched and a first session booked; did the client show up? Two things stand out. First, attendance has been slipping — 92.5% in CY2022 down to ~83% in CY2025–26 for the population. Second, the decline is steeper for younger clients: under-18s fell from 89% to ~76–80% and 18–21s from 92% to ~77–80%, while 60+ held in the high-80s. This is the one place in the funnel where the age gap has widened rather than narrowed."
          footnote="Source: B1 match status report. Booked = Matched & 1st Session Attended + Matched & 1st Session Not Attended; the handful of still-scheduled sessions are excluded. CY2026 is partial (to May 31). Hover for group sizes."
        >
          <YearSelect selected={attendBands} onChange={setAttendBands} years={ORDER} label="Age group" />
          <ResponsiveContainer width="100%" height={310}>
            <ComposedChart data={attendTrend} margin={{ top: 5, right: 10, left: 0, bottom: 0 }}>
              <CartesianGrid stroke={C.grid} vertical={false} />
              <XAxis dataKey="year" tick={{ fontSize: 11.5, fill: C.sub }} />
              <YAxis unit="%" domain={[70, 100]} tick={{ fontSize: 11.5, fill: C.sub }} />
              <Tooltip contentStyle={tipStyle} formatter={(v, n, item) => {
                const d = item && item.payload ? item.payload : {};
                if (n === "Selected group") return [`${v}% (booked n=${(d.groupN || 0).toLocaleString()})`, n];
                if (n === "All ages") return [`${v}% (booked n=${(d.overallN || 0).toLocaleString()})`, n];
                return [`${v}%`, n];
              }} />
              <Legend wrapperStyle={{ fontSize: 12 }} />
              <Line dataKey="overall" name="All ages" stroke={C.slate} strokeWidth={2} strokeDasharray="6 4" dot={{ r: 3 }} />
              <Line dataKey="group" name="Selected group" stroke={C.teal} strokeWidth={3} dot={{ r: 4 }} connectNulls
                label={{ position: "top", fontSize: 10.5, fill: C.teal, fontWeight: 600, formatter: (v) => (v === null || v === undefined ? "" : `${v}%`) }} />
            </ComposedChart>
          </ResponsiveContainer>
        </Card>

        {/* Takeaways */}
        <Card title="What this suggests">
          <div style={{ fontSize: 13.5, color: C.ink, lineHeight: 1.65 }}>
            <p style={{ margin: "4px 0" }}><b>The problem for younger clients is starting, not staying.</b> 18–24s make up ~11,200 intakes but only ~28% attend a first session, versus ~42% for 35+. Closing even a third of that gap is roughly 500+ additional clients starting care per year — and once started, they retain and engage at or above average.</p>
            <p style={{ margin: "10px 0 4px" }}><b>The lever is the form-to-call step.</b> The entire conversion gap lives in "Form only" and intake no-shows, not in matching. Faster or lower-friction booking for under-27s (instant self-scheduling, SMS-first follow-up, evening slots) targets exactly where they leak.</p>
            <p style={{ margin: "10px 0 4px" }}><b>Ages 24–26 are a genuine transition.</b> Conversion accelerates precisely across the window where clients typically age off student coverage/campus care and onto extended health benefits — worth confirming against payer data, and worth messaging ("your new benefits likely cover this") to the 22–25 group.</p>
            <p style={{ margin: "10px 0 4px" }}><b>Minors and 60+ are distinct segments.</b> Under-18s face a supply problem (26% unmatched) plus the highest early drop-off; 60+ convert well at intake but drop off faster and do fewer sessions. Different fixes for each.</p>
          </div>
        </Card>

        <div style={{ fontSize: 11.5, color: C.sub, paddingBottom: 20 }}>
          Caveats: age is measured at record creation, not necessarily at first session. ~59 records lack age. B1 reports cover created dates 2022–May 2026; A.5.1 and D.1 cover first sessions 2021–May 2026, so populations differ slightly. CY2026 is partial (Jan–May).
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(AgeInsightsDashboard));
</script>
</body>
</html>
